<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mapa DIVIPOLA - Multilista Jerárquica</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { width: 100%; height: 100vh; }
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3); max-width: 300px;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <h3>Jerarquía DIVIPOLA</h3>
        <p>Visualización interactiva basada en Multilistas de Python consumidas desde Flask.</p>
        <div id="stats">Cargando datos...</div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([4.570868, -74.297333], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        fetch('/api/divipola')
            .then(response => response.json())
            .then(data => {
                let totalMunicipios = 0;
                let totalDepartamentos = data.departamentos.length;

                data.departamentos.forEach(dpto => {
                    dpto.municipios.forEach(mun => {
                        if (mun.latitud !== 0.0 && mun.longitud !== 0.0) {
                            totalMunicipios++;
                            const marker = L.marker([mun.latitud, mun.longitud]).addTo(map);
                            marker.bindPopup(`
                                <b>País:</b> ${data.pais}<br>
                                <b>Departamento:</b> ${dpto.nombre} (${dpto.codigo})<br>
                                <b>Municipio:</b> ${mun.nombre} (${mun.codigo})
                            `);
                        }
                    });
                });

                document.getElementById('stats').innerHTML = `
                    <b>País:</b> ${data.pais}<br>
                    <b>Departamentos:</b> ${totalDepartamentos}<br>
                    <b>Municipios georeferenciados:</b> ${totalMunicipios}
                `;
            })
            .catch(error => console.error('Error cargando la multilista:', error));
    </script>
</body>
</html>
